
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | ShopEasy</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <a href="index.html" class="logo">ShopEasy</a>

        <a href="index.html" class="cart-link">
            Continue Shopping
        </a>
    </header>

    <!-- Cart Section -->
    <main class="cart-page">

        <h1>Shopping Cart</h1>

        <div class="cart-layout">

            <!-- Cart Items -->
            <section class="cart-items-section">

                <div id="cart-items">
                    <!-- Cart items will appear here -->
                </div>

                <div id="empty-cart" style="display: none;">
                    <h2>Your cart is empty!</h2>
                    <p>Add some products to get started.</p>

                    <a href="index.html" class="shop-btn">
                        Start Shopping
                    </a>
                </div>

            </section>

            <!-- Order Summary -->
            <aside class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="shipping-cost">₹0</span>
                </div>

                <hr>

                <div class="summary-row total-row">
                    <strong>Total</strong>
                    <strong id="cart-total">₹0</strong>
                </div>

                <button id="checkout-btn" class="checkout-btn">
                    Proceed to Checkout
                </button>

                <button id="clear-cart-btn" class="clear-cart-btn">
                    Clear Cart
                </button>

                <p class="cart-note">
                    Shipping is free on all orders.
                </p>

            </aside>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 ShopEasy. All rights reserved.</p>
    </footer>

    <!-- Cart JavaScript -->
    <script src="cart.js"></script>

</body>
</html>
